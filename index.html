<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留言墙</title>
<meta name="description" content="一块可以随手贴便签的留言墙。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='7' width='24' height='22' rx='2' fill='%23fdf0bd'/%3E%3Ccircle cx='16' cy='9' r='2.6' fill='%23c8443a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="reply.css">
</head>
<body>

<div id="fileWarn" class="file-warn" hidden>
  这个页面要在 Cloudflare 的网址上打开才能留言：直接双击本地文件的话，后台连不上。
</div>

<header class="sign">
  <div class="sign-main">
    <h1>留言墙</h1>
    <p>有什么想说的，写下来，贴上去。</p>
  </div>
  <div class="count-tag"><b id="total">0</b>条留言贴在墙上</div>
</header>

<main class="board">
  <div class="compose-wrap">
    <form id="composer" class="note compose" novalidate>
      <span class="pin" aria-hidden="true"></span>
      <h2>写一条留言</h2>

      <label class="field">
        <span>你的名字</span>
        <input id="name" name="name" type="text" maxlength="12" autocomplete="nickname" placeholder="不填就叫匿名访客">
      </label>

      <label class="field">
        <span>想说的话</span>
        <textarea id="content" name="content" maxlength="200" rows="5" placeholder="随便写，别太客气。"></textarea>
      </label>

      <div class="compose-row">
        <div class="colors" role="radiogroup" aria-label="便签颜色">
          <label class="swatch"><input type="radio" name="color" value="yellow" checked><span class="dot" style="background:#f5e79f"></span><span class="sr">黄色便签</span></label>
          <label class="swatch"><input type="radio" name="color" value="pink"><span class="dot" style="background:#f3c3c0"></span><span class="sr">粉色便签</span></label>
          <label class="swatch"><input type="radio" name="color" value="blue"><span class="dot" style="background:#bed6ee"></span><span class="sr">蓝色便签</span></label>
          <label class="swatch"><input type="radio" name="color" value="green"><span class="dot" style="background:#cfe4ad"></span><span class="sr">绿色便签</span></label>
          <label class="swatch"><input type="radio" name="color" value="lilac"><span class="dot" style="background:#ddc7eb"></span><span class="sr">紫色便签</span></label>
        </div>
        <span class="counter"><span id="counter">0</span>/200</span>
      </div>

      <button class="submit" type="submit" id="submitBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M12 16l-4.5-4.5M12 16l4.5-4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        贴上墙
      </button>
      <p class="hint">按 Ctrl + Enter 也能贴上</p>
    </form>
  </div>

  <section class="wall" aria-label="墙上的留言">
    <div class="wall-bar">
      <div class="tabs" role="tablist" aria-label="留言排序">
        <button class="tab" type="button" role="tab" data-order="new" aria-selected="true">最新</button>
        <button class="tab" type="button" role="tab" data-order="old" aria-selected="false">最早</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20 20"/></svg>
        <input id="search" type="search" maxlength="40" placeholder="搜一搜墙上的话" aria-label="搜索留言">
      </label>
    </div>

    <div id="notes" class="notes"></div>

    <div id="empty" class="empty" hidden>
      <p class="empty-title">墙上还空着</p>
      <p>写下第一条留言，让这里有点人气。</p>
      <button class="more" type="button" id="emptyBtn">去写一条</button>
    </div>

    <button class="more" type="button" id="moreBtn" hidden>再往下翻翻</button>
  </section>
</main>

<footer class="foot">
  <span>留言存在 Cloudflare 的 KV 里</span>
  <span class="foot-right">动态后台由 Cloudflare Pages 提供<button class="admin-entry" type="button" id="adminBtn">管理员</button></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="wall.js"></script>
</body>
</html>
