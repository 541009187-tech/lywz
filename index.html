<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✅ 加长后的标题，解决【标题太短】 -->
  <title>云端留言板 | 在线访客留言系统，管理员后台管理</title>
  <meta name="description" content="免费在线云端留言板，访客可在线提交留言，管理员专属后台管理，支持自定义留言上限">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://lywz-esc.pages.dev/">
  <!-- 必应 Bing 所有权验证标签 -->
  <meta name="msvalidate.01" content="5375C1040004CDBEFCF73F7C9133AD5E" />
</head>
<body>
<div class="wrap">
  <div class="card">
    <!-- ✅ 改成 <h1> 解决【缺少h1标记】 -->
    <h1 style="text-align:center;margin-bottom:16px">云端留言板</h1>
    <input type="text" id="nick" placeholder="你的昵称">
    <textarea id="content" rows="4" placeholder="写下留言..."></textarea>
    <button onclick="sendMsg()">提交留言</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:12px">留言列表</h2>
    <div id="listBox"></div>
  </div>
</div>
<style>
    * {box-sizing: border-box;margin:0;padding:0;font-family:Microsoft YaHei}
    body{background:#f1f5f9;padding:20px}
    .wrap{max-width:600px;margin:0 auto}
    .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #00000008}
    input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px;margin-bottom:12px}
    button{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
    .msg-item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px}
    .msg-nick{font-weight:bold;color:#2563eb}
    .msg-time{font-size:12px;color:#64748b}
    .msg-text{margin-top:6px;line-height:1.6}
</style>
<script>
  const ADMIN_BACKEND_URL = "https://lybht.pages.dev";
  const API = "";
  const ADMIN_ACCOUNT = "管理员";

  async function load(){
    const res=await fetch(`${API}/msg`)
    const d=await res.json()
    const list=d.list||[]
    let html=""
    for(let i=list.length-1;i>=0;i--){
      const it=list[i]
      html+=`<div class="msg-item">
        <div class="msg-nick">${it.nick}</div>
        <div class="msg-time">${it.t}</div>
        <div class="msg-text">${it.c}</div>
      </div>`
    }
    document.getElementById("listBox").innerHTML=html
  }

  async function sendMsg(){
    const nick=document.getElementById("nick").value.trim()
    const c=document.getElementById("content").value.trim()

    if(nick === ADMIN_ACCOUNT){
      location.href = ADMIN_BACKEND_URL;
      return;
    }

    if(!nick||!c)return alert("昵称和留言不能为空")
    await fetch(`${API}/msg`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nick,c})
    })
    document.getElementById("content").value=""
    load()
  }

  load()
  setInterval(load,10000)
</script>
</body>
